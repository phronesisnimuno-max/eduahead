<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAhead — Staff Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell hidden" id="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">E</span>
        <span>Edu<span class="brand-accent">Ahead</span></span>
      </div>
      <nav class="side-nav" id="nav"></nav>
      <div class="sidebar-bottom">
        <button class="btn btn-ghost btn-small" onclick="Auth.logout()">Log out</button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><strong id="who"></strong></div>
      </header>
      <div class="content" id="app"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <!-- Core Scripts -->
  <script src="js/config.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
</body>
